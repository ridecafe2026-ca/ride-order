<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>RIDE Order</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — mode banner, category chips, 2-col drink grid, sticky cart bar, bottom sheets. Single dark look matching the rich menu. */
:root{
  --bg:#0A1230; --surface:#121D45; --surface-2:#1A2858; --line:rgba(160,180,255,.16);
  --fg:#EEF2FF; --muted:#9AA6C8; --accent:#3E6BFF; --accent-2:#9DB4FF; --accent-fg:#fff;
  --gsb:#E6007E; --supalai:#E3A41C; --ok:#3DD68C; --warn:#FFB547;
  --display:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Kanit",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}

.demo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:10px;font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line)}
.demo b{color:var(--warn);font-weight:600}
.demo button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
.demo button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}

header{padding-block:20px 8px}
.brand{font-family:var(--display);font-weight:600;letter-spacing:.18em;font-size:13px;color:var(--muted)}
.brand::after{content:"";display:block;width:18px;height:2px;background:var(--fg);margin-top:6px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:12px 0 0;text-wrap:balance}
.perk{margin-top:12px;border-radius:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);display:grid;gap:4px;font-size:13.5px}
.perk[data-p="gsb"]{border-color:color-mix(in srgb,var(--gsb) 60%,transparent)}
.perk[data-p="supalai"]{border-color:color-mix(in srgb,var(--supalai) 60%,transparent)}
.perk .tag{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.04em}
.perk[data-p="gsb"] .tag{color:var(--gsb)} .perk[data-p="supalai"] .tag{color:var(--supalai)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-size:15px;letter-spacing:.06em;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px;padding-block:8px}
.card{background:var(--surface);border:0;padding:0;margin:0;text-align:left;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.97)}
.card.out{cursor:default}
.card.out .pic img,.card.out .pic svg{filter:grayscale(1);opacity:.45}
.soldout{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,18,48,.85);color:var(--fg);font-weight:600;font-size:14px;border-radius:8px;padding:6px 10px;white-space:nowrap}
.card.has{outline:2px solid var(--ok);outline-offset:-2px}
.pic{aspect-ratio:3/4;max-width:100%;position:relative;background:var(--surface-2);display:grid;place-items:center}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic svg{width:44%;height:auto}
.badge{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px}
.info{padding:10px 10px 12px;display:grid;gap:4px;flex:1;align-content:start}
.name{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2}
.name .en{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.g2{color:var(--muted);font-size:13.5px}
.req{color:var(--warn);letter-spacing:0;margin-left:6px}
.freepick{background:var(--bg);border:1px solid color-mix(in srgb,var(--ok) 50%,transparent);border-radius:12px;padding:12px}
.seg small{display:block;font-weight:400;font-size:11px;opacity:.75}
.hero{width:min(100%,240px);max-width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block;margin:0 auto}
.price{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;font-size:19px;color:var(--accent-2)}
.grid[data-cols="3"] .name{font-size:18px;line-height:1.2}
.grid[data-cols="3"] .price{font-size:18px}
.grid[data-cols="3"] .info{padding:9px 8px 11px}
.grid[data-cols="3"] .name .en{font-size:12.5px}
.grid[data-cols="4"] .name,.grid[data-cols="4"] .price{font-size:13px}
.grid[data-cols="4"] .en,.grid[data-cols="4"] .badge{display:none}
.inCart{font-size:14px;font-weight:600;color:var(--ok)}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cartbar button{width:100%;max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);padding:14px 18px;font-family:var(--display);font-weight:600;font-size:17px}
.cartbar .sub{font-family:var(--body);font-weight:500;font-size:14px;opacity:.9}

.scrim{position:fixed;inset:0;background:rgba(3,6,20,.6);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
.sheet h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0}
.lbl{font-size:14px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 4px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px}
.qty output{font-family:var(--display);font-size:20px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
textarea,input{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px 12px;font:inherit}
.primary{border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);padding:14px;font-family:var(--display);font-weight:600;font-size:17px;width:100%}
.primary:disabled{opacity:.4;cursor:not-allowed}

.lines{display:grid;gap:10px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.line .t{min-width:0}.line .t small{display:block;color:var(--muted);font-size:12.5px}
.line .q{display:flex;align-items:center;gap:6px}
.line .q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg)}
.line .acts{display:flex;gap:8px;margin-top:6px}
.line .acts button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 12px;font-size:14px;font-weight:600}
.line .acts .del{color:var(--bad,#FF6B6B);border-color:rgba(255,107,107,.5)}
.restored{font-size:13px;color:var(--muted);text-align:center}
.line .p{font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.free{color:var(--ok)}
.sum{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:10px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-family:var(--display);font-size:20px;font-weight:600}
.note{font-size:13px;border-radius:10px;padding:8px 12px;background:var(--bg);color:var(--warn)}
.note.ok{color:var(--ok)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fields label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.radios{display:flex;gap:8px}
.radios button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px}
.radios button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 25%,var(--bg))}
.radios button:disabled{opacity:.4}

.chat{background:#8FA8C9;border-radius:14px;padding:16px;display:flex;justify-content:flex-end}
.bubble{background:#fff;color:#111;border-radius:14px;width:260px;max-width:100%;padding:14px;font-size:13px;display:grid;gap:6px}
.bubble h3{margin:0;font-family:var(--display);font-size:16px}
.bubble .r{display:flex;justify-content:space-between;gap:8px}
.bubble .g{color:#777;font-size:12px}
.bubble hr{border:0;border-top:1px solid #ddd;margin:2px 0;width:100%}
.done{text-align:center;padding:40px 0;display:grid;gap:8px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

</head>
<body>
<div class="wrap">
  <div class="demo" id="demo" hidden><b>เปิดนอกแอป LINE</b> ดูเมนูได้ แต่ส่งออเดอร์ได้เฉพาะในแชต RiDE Cafe · ดูโหมด:
    <button data-m="menu">ช่อง 1 เมนู</button><button data-m="best">ช่อง 2 แนะนำ</button><button data-m="gsb">ช่อง 4 ออมสิน</button><button data-m="supalai">ช่อง 5 ศุภาลัย</button>
  </div>
  <header>
    <div class="brand">RIDE COFFEE</div>
    <h1 id="title">เมนูทั้งหมด</h1>
    <div class="perk" id="perk" hidden></div>
  </header>
  <nav class="chips" id="chips" aria-label="หมวดเมนู"></nav>
  <main class="grid" id="grid"></main>
</div>
<div class="cartbar" id="cartbar" hidden><button id="openCart"><span id="cartCount">0 แก้ว</span><span class="sub" id="cartTotal">฿0 · ดูตะกร้า</span></button></div>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></section>

<script>
/* ===== ตั้งค่าร้าน — แก้ตรงนี้ ===== */
const CONFIG = {
  liffId: "2012186332-euJlp03P",   // LIFF ID จาก LINE Developers (ช่อง RIDE Order)
  api: "https://ride-order-api.ride-cafe-2026.workers.dev",    // ระบบหลังบ้านบน Cloudflare (รับออเดอร์ + ส่ง QR ชำระเงิน)
  discount: 0.10,        // ส่วนลดพาร์ทเนอร์ 10% ต่อบิล
  freeAt: 5,             // ครบกี่แก้วต่อบิลได้แถม
  freeItem: "อเมริกาโน่ (แถมฟรี)",
  columns: 3             // จำนวนเมนูต่อแถว (2, 3 หรือ 4)
};
const SWEET = ["125%","100%","75%","50%","25%","0%"];
/* coffee:true = เลือกเมล็ดได้, matcha:true = อัปเกรดมัทฉะเกรดพิธีได้ */
let CATS = [
  {id:"black", name:"BLACK COFFEE", tint:"#5A3A26", coffee:true},
  {id:"white", name:"WHITE COFFEE", tint:"#C8935A", coffee:true},
  {id:"mocktail", name:"MOCKTAIL COFFEE", tint:"#E59A3B", coffee:true},
  {id:"matcha", name:"MATCHA", tint:"#7DB46C", matcha:true},
  {id:"noncoffee", name:"NON-COFFEE", tint:"#C97A6A"}
];
const BEANS = [{name:"Long Drive", note:"คั่วกลางค่อนเข้ม"},{name:"View Point", note:"คั่วกลาง"}];
const MILKS = [{name:"นมวัว", add:0},{name:"นมโอ๊ต", add:0},{name:"Lactose-Free", add:5}];
const UJI = {name:"มัทฉะเกรดพิธี (Uji Ceremony)", add:30};
/* เมนู: image = ชื่อไฟล์ในโฟลเดอร์ images/ (เว้นว่างได้), best = เมนูแนะนำ, milk:true = เลือกนมได้ */
let MENU = [   /* สำรอง: หน้าเว็บอ่านเมนูจริงจากไฟล์ menu.json (แก้ผ่านหน้า admin) */
  {id:"americano", cat:"black", name:"อเมริกาโน่", en:"Americano", price:65, image:""},
  {id:"aerocano", cat:"black", name:"แอโรกาโน่", en:"Aerocano", price:70, image:"aerocano.jpg", best:true},
  {id:"latte", cat:"white", name:"ลาเต้", en:"Latte", price:70, image:"latte.jpg", best:true, milk:true},
  {id:"mocha", cat:"white", name:"มอคค่า", en:"Mocha", price:80, image:"", milk:true},
  {id:"es-yen", cat:"white", name:"เอสเย็น", en:"Es-Yen Thai Style", price:70, image:"", milk:true},
  {id:"cappuccino", cat:"white", name:"คาปูชิโน่", en:"Cappuccino", price:75, image:"cappuccino.jpg", best:true, milk:true},
  {id:"americano-honey-lemon", cat:"mocktail", name:"อเมริกาโน่น้ำผึ้งเลม่อน", en:"Americano Honey Lemon", price:90, image:"americano-honey-lemon.jpg", best:true},
  {id:"coconut-water-coffee", cat:"mocktail", name:"กาแฟน้ำมะพร้าวสด", en:"Coconut Water Coffee", price:80, image:"coconut-water-coffee.jpg", best:true},
  {id:"black-sesame-oat", cat:"mocktail", name:"กาแฟงาดำนมโอ๊ต", en:"Black Sesame Oat Latte", price:100, image:"black-sesame-oat.jpg", best:true},
  {id:"americano-yuzu", cat:"mocktail", name:"กาแฟยูสุ", en:"Americano Yuzu", price:100, image:"americano-yuzu.jpg", best:true},
  {id:"clear-matcha", cat:"matcha", name:"เคลียร์มัทฉะ", en:"Clear Matcha", price:85, image:""},
  {id:"matcha-latte", cat:"matcha", name:"มัทฉะลาเต้", en:"Matcha Latte", price:90, image:"", milk:true},
  {id:"honey-lemon-matcha", cat:"matcha", name:"มัทฉะน้ำผึ้งเลม่อน", en:"Honey Lemon Matcha", price:100, image:""},
  {id:"coconut-water-matcha", cat:"matcha", name:"มัทฉะน้ำมะพร้าวสด", en:"Coconut Water Matcha", price:90, image:""},
  {id:"coconut-cloud-matcha", cat:"matcha", name:"มัทฉะน้ำมะพร้าวโฟมนม", en:"Coconut Cloud Matcha", price:95, image:"coconut-cloud-matcha.jpg", best:true, milk:true},
  {id:"earl-grey-matcha", cat:"matcha", name:"มัทฉะเอิร์ลเกรย์", en:"Earl Grey Matcha Cold Foam", price:95, image:"", milk:true},
  {id:"matcha-yuzu", cat:"matcha", name:"มัทฉะยูสุ", en:"Matcha Yuzu", price:110, image:"matcha-yuzu.jpg", best:true},
  {id:"chocolate-no3", cat:"noncoffee", name:"ช็อกโกแลต", en:"Chocolate No.3", price:90, image:"chocolate-no3.jpg", best:true, milk:true},
  {id:"thai-tea", cat:"noncoffee", name:"ชาเย็น", en:"Thai Tea", price:75, image:"", milk:true},
  {id:"honey-lemon-soda", cat:"noncoffee", name:"น้ำผึ้งเลม่อนโซดา", en:"Honey Lemon Soda", price:75, image:""},
  {id:"yuzu-soda", cat:"noncoffee", name:"ยูสุโซดา", en:"Yuzu Soda", price:85, image:""}
];
const MODES = {
  menu:{title:"เมนูทั้งหมด"},
  best:{title:"เมนูแนะนำประจำร้าน", bestOnly:true},
  gsb:{title:"สิทธิพิเศษพนักงานออมสิน", partner:{key:"gsb", label:"พนักงานออมสิน สาขาบงคำ", minDelivery:1,
        fields:[{id:"name",label:"ชื่อ"},{id:"floor",label:"ชั้น"}]}},
  supalai:{title:"สิทธิพิเศษเพื่อนบ้านศุภาลัย", partner:{key:"supalai", label:"เพื่อนบ้านศุภาลัย", minDelivery:2,
        fields:[{id:"house",label:"บ้านเลขที่"},{id:"soi",label:"ซอย"}]}}
};
/* ===== จบส่วนตั้งค่า ===== */

const $=s=>document.querySelector(s);
const baht=n=>"฿"+n.toLocaleString("th-TH");
const params=new URLSearchParams(location.search);
let mode=MODES[params.get("mode")]?params.get("mode"):(MODES[location.hash.slice(1)]?location.hash.slice(1):"menu");
let cat="all", cart=[], info={}, method="delivery", liffReady=false, freeSw=null, freeBean=0;
const freeOpts=()=>["หวาน "+freeSw, BEANS[freeBean].name];

function imgUrl(item){ return item.image ? new URL(/^https?:/.test(item.image)?item.image:"images/"+item.image, location.href).href : ""; }
function cup(tint){return `<svg viewBox="0 0 60 80" aria-hidden="true"><path d="M8 14h44l-5 60a4 4 0 0 1-4 4H17a4 4 0 0 1-4-4z" fill="${tint}" opacity=".9"/><path d="M5 8h50v8H5z" fill="#EEF2FF" opacity=".85"/><path d="M33 0l-3 8" stroke="#EEF2FF" stroke-width="3"/></svg>`;}
function catOf(id){return CATS.find(c=>c.id===id)||{id,name:"",tint:"#8A93B8"}}

/* ---- จำตะกร้าไว้ในเครื่อง ถ้าลูกค้าปิดหน้าสั่งโดยไม่ได้ตั้งใจ ---- */
let loadedMode=null;
const cartKey=()=>"rideCart:"+mode;
function saveCart(){ try{ if(loadedMode!==mode) return; localStorage.setItem(cartKey(),JSON.stringify({t:Date.now(),cart,info,method,freeSw,freeBean})); }catch(e){} }
function clearCart(){ try{ localStorage.removeItem(cartKey()); }catch(e){} }
function loadCart(){
  loadedMode=mode;
  try{ const d=JSON.parse(localStorage.getItem(cartKey())||"null");
    if(d&&Date.now()-d.t<24*3600e3&&Array.isArray(d.cart)){ cart=d.cart; info=d.info||{}; method=d.method||"delivery"; freeSw=SWEET.includes(d.freeSw)?d.freeSw:null; freeBean=d.freeBean||0; }
    else { cart=[]; info={}; freeSw=null; freeBean=0; }
  }catch(e){}
}
function repriceCart(){
  cart=cart.filter(l=>{ const it=MENU.find(x=>x.id===l.id); if(!it||it.hidden||it.soldout) return false;
    l.name=it.name; l.price=it.price+MILKS.reduce((a,m)=>a+(l.opts.includes(m.name)?m.add:0),0)+(l.opts.includes("เกรดพิธี")?UJI.add:0); return true; });
}
function render(){
  if(loadedMode!==mode) loadCart();
  repriceCart(); saveCart();
  const m=MODES[mode];
  $("#title").textContent=m.title;
  const perk=$("#perk");
  if(m.partner){
    const p=m.partner;
    perk.hidden=false; perk.dataset.p=p.key;
    perk.innerHTML=`<span class="tag">${p.label.toUpperCase()}</span>
      <span>ลด ${CONFIG.discount*100}% ทุกแก้ว · ส่งฟรีถึงที่ตั้งแต่ ${p.minDelivery} แก้วขึ้นไป</span>
      <span>ครบ ${CONFIG.freeAt} แก้วต่อบิล รับอเมริกาโน่ฟรี 1 แก้ว</span>`;
  } else perk.hidden=true;
  document.querySelectorAll(".demo button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mode));

  const items=MENU.filter(i=>!i.hidden&&(!m.bestOnly||i.best));
  const cats=CATS.filter(c=>items.some(i=>i.cat===c.id));
  $("#chips").hidden=cats.length<2;
  $("#chips").innerHTML=[{id:"all",name:"ทั้งหมด"},...cats].map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${cat===c.id}">${c.name}</button>`).join("");
  const cols=+(new URLSearchParams(location.search).get("cols"))||CONFIG.columns;
  $("#grid").dataset.cols=cols; $("#grid").style.setProperty("--cols",cols);
  $("#grid").innerHTML=items.filter(i=>cat==="all"||i.cat===cat).map(i=>{
    const n=cart.filter(l=>l.id===i.id).reduce((a,l)=>a+l.qty,0);
    const u=imgUrl(i);
    return `<button class="card${n?" has":""}${i.soldout?" out":""}" ${i.soldout?"disabled":`data-add="${i.id}"`} aria-label="สั่ง ${i.name}"><div class="pic">${u?`<img src="${u}" alt="${i.name}" loading="lazy">`:cup(catOf(i.cat).tint)}${i.best&&!m.bestOnly?'<span class="badge">แนะนำ</span>':""}${i.soldout?'<span class="soldout">หมดชั่วคราว</span>':""}</div>
      <div class="info"><div class="name">${i.name}<small class="en">${i.en||""}</small></div><div class="price">${baht(i.price)}</div>
      ${n?`<div class="inCart">✓ ในตะกร้า ${n} แก้ว</div>`:""}</div></button>`;
  }).join("");
  renderBar();
}
function totals(){
  const p=MODES[mode].partner;
  const cups=cart.reduce((a,l)=>a+l.qty,0);
  const sub=cart.reduce((a,l)=>a+l.qty*l.price,0);
  const disc=p?Math.round(sub*CONFIG.discount):0;
  const free=p&&cups>=CONFIG.freeAt;
  return {cups,sub,disc,free,total:sub-disc};
}
function renderBar(){
  const t=totals();
  $("#cartbar").hidden=!t.cups;
  $("#cartCount").textContent=`สั่งเลย · ${t.cups} แก้ว`;
  $("#cartTotal").textContent=`${baht(t.total)} · ดูตะกร้า`;
}
function openSheet(html){ $("#sheetIn").innerHTML='<div class="grab"></div>'+html; $("#sheet").hidden=false; $("#scrim").hidden=false; }
function closeSheet(){ $("#sheet").hidden=true; $("#scrim").hidden=true; }

function pickSheet(id, editIdx){
  const i=MENU.find(x=>x.id===id), c=catOf(i.cat);
  let sw=null, bean=c.coffee?0:null, milk=i.milk?0:null, uji=false, q=1;
  const editing=Number.isInteger(editIdx) && cart[editIdx];
  if(editing){ const o=cart[editIdx].opts||[];
    const s0=o.find(x=>x.startsWith("หวาน ")); if(s0){ const v=s0.slice(5); sw=SWEET.includes(v)?v:null; }
    if(bean!==null){ const k=BEANS.findIndex(b=>o.includes(b.name)); if(k>=0) bean=k; }
    if(milk!==null){ const k=MILKS.findIndex(m=>o.includes(m.name)); if(k>=0) milk=k; }
    uji=o.includes("เกรดพิธี"); q=cart[editIdx].qty; }
  const unit=()=>i.price+(milk!==null?MILKS[milk].add:0)+(uji?UJI.add:0);
  const seg=(key,list,sel,label)=>`<div class="seg" style="grid-template-columns:repeat(${list.length},minmax(0,1fr))">${list.map((x,n)=>`<button data-${key}="${n}" aria-pressed="${n===sel}">${label(x)}</button>`).join("")}</div>`;
  const draw=()=>{
    const pic=imgUrl(i);
    openSheet(`<div><h2>${i.name}</h2><div class="g2">${i.en||""} · ${baht(i.price)}</div></div>
    ${pic?`<img class="hero" src="${pic}" alt="">`:""}
    ${c.nosweet?"":`<div><div class="lbl">ระดับความหวาน <span class="req">ต้องเลือก</span></div>${seg("sw",SWEET,SWEET.indexOf(sw),x=>x).replace("repeat(6,","repeat(3,")}</div>`}
    ${bean!==null?`<div><div class="lbl">เมล็ดกาแฟ</div>${seg("bean",BEANS,bean,x=>`${x.name}<small>${x.note}</small>`)}</div>`:""}
    ${milk!==null?`<div><div class="lbl">นม</div>${seg("milk",MILKS,milk,x=>`${x.name}${x.add?`<small>+${baht(x.add)}</small>`:""}`)}</div>`:""}
    ${c.matcha?`<div><div class="lbl">อัปเกรดมัทฉะ</div><div class="seg" style="grid-template-columns:1fr"><button data-uji="1" aria-pressed="${uji}">${UJI.name} +${baht(UJI.add)}</button></div></div>`:""}
    <div><div class="lbl">จำนวน</div><div class="qty"><button data-q="-1" aria-label="ลด">−</button><output>${q}</output><button data-q="1" aria-label="เพิ่ม">+</button></div></div>
    <button class="primary" id="addBtn" ${sw||c.nosweet?"":"disabled"}>${sw||c.nosweet?`${editing?"บันทึกการแก้ไข":"ใส่ตะกร้า"} · ${baht(unit()*q)}`:"เลือกระดับความหวานก่อน"}</button>
    ${editing?`<button class="primary" id="backBtn" style="background:transparent;border:1px solid var(--line)">ยกเลิก กลับไปตะกร้า</button>`:""}`);
  };
  draw();
  $("#sheetIn").onclick=e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.sw){sw=SWEET[+b.dataset.sw];draw();}
    else if(b.dataset.bean){bean=+b.dataset.bean;draw();}
    else if(b.dataset.milk){milk=+b.dataset.milk;draw();}
    else if(b.dataset.uji){uji=!uji;draw();}
    else if(b.dataset.q){q=Math.max(1,q+ +b.dataset.q);draw();}
    else if(b.id==="backBtn"){ cartSheet(); }
    else if(b.id==="addBtn" && (sw||c.nosweet)){
      const opts=sw?["หวาน "+sw]:[];
      if(bean!==null) opts.push(BEANS[bean].name);
      if(milk!==null) opts.push(MILKS[milk].name);
      if(uji) opts.push("เกรดพิธี");
      const key=i.id+"|"+opts.join("|");
      if(editing){
        cart[editIdx]={...cart[editIdx],key,price:unit(),opts,qty:q};
        const dup=cart.findIndex((l,k)=>k!==editIdx&&l.key===key);
        if(dup>=0){ cart[dup].qty+=cart[editIdx].qty; cart.splice(editIdx,1); }
        render(); cartSheet(); return;
      }
      const ex=cart.find(l=>l.key===key);
      ex?ex.qty+=q:cart.push({key,id:i.id,name:i.name,price:unit(),opts,qty:q,image:imgUrl(i)});
      closeSheet(); render();
    }
  };
}

function cartSheet(){
  const m=MODES[mode], p=m.partner, t=totals();
  if(!t.cups){closeSheet();render();return;}
  if(p && t.cups<p.minDelivery) method="pickup";
  const canDeliver=p && t.cups>=p.minDelivery;
  const missing=p?p.fields.filter(f=>!(info[f.id]||"").trim()):[];
  openSheet(`<h2>ตะกร้าของคุณ</h2>
    <div class="lines">${cart.map((l,k)=>`<div class="line"><div class="t">${l.name}<small>${[...l.opts,baht(l.price)].join(" · ")}</small>
        <div class="acts"><button data-edit="${k}">✏️ แก้ไข</button><button class="del" data-del="${k}">🗑 ลบ</button></div></div>
      <div class="q"><button data-k="${k}" data-d="-1" aria-label="ลด">−</button>${l.qty}<button data-k="${k}" data-d="1" aria-label="เพิ่ม">+</button></div><div class="p">${baht(l.qty*l.price)}</div></div>`).join("")}
      ${t.free?`<div class="line free"><div class="t">${CONFIG.freeItem}${freeSw?`<small>${freeOpts().join(" · ")}</small>`:""}</div><div class="q">1</div><div class="p">฿0</div></div>`:""}
    </div>
    ${t.free?`<div class="freepick"><div class="lbl">ความหวานอเมริกาโน่แถมฟรี <span class="req">ต้องเลือก</span></div>
      <div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))">${SWEET.map((x,n)=>`<button data-fsw="${n}" aria-pressed="${x===freeSw}">${x}</button>`).join("")}</div>
      <div class="lbl" style="margin-top:10px">เมล็ดกาแฟ</div>
      <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))">${BEANS.map((x,n)=>`<button data-fbean="${n}" aria-pressed="${n===freeBean}">${x.name}<small>${x.note}</small></button>`).join("")}</div></div>`:""}
    ${p&&!t.free?`<div class="note">อีก ${CONFIG.freeAt-t.cups} แก้ว รับอเมริกาโน่ฟรี 1 แก้ว</div>`:""}
    <div class="sum"><div><span>รวม</span><span>${baht(t.sub)}</span></div>
      ${p?`<div class="free"><span>ส่วนลด ${p.label} ${CONFIG.discount*100}%</span><span>−${baht(t.disc)}</span></div>`:""}
      <div class="tot"><span>ยอดชำระ</span><span>${baht(t.total)}</span></div></div>
    ${p?`<div><div class="lbl">การรับสินค้า</div><div class="radios">
        <button data-method="delivery" aria-pressed="${method==="delivery"}" ${canDeliver?"":"disabled"}>ส่งถึงที่ (ฟรี)</button>
        <button data-method="pickup" aria-pressed="${method==="pickup"}">รับที่ร้าน</button></div></div>
      ${canDeliver?"":`<div class="note">ส่งฟรีตั้งแต่ ${p.minDelivery} แก้ว เพิ่มอีก ${p.minDelivery-t.cups} แก้วเพื่อให้ไปส่ง</div>`}
      <div><div class="lbl">ข้อมูลยืนยันสิทธิ์${method==="delivery"?" และที่อยู่จัดส่ง":""}</div><div class="fields">
        ${p.fields.map(f=>`<label for="f-${f.id}">${f.label}<input id="f-${f.id}" data-f="${f.id}" value="${(info[f.id]||"").replace(/"/g,"&quot;")}" autocomplete="off"></label>`).join("")}</div></div>`
      :`<div class="note ok">รับที่ร้าน · ทางร้านจะแจ้งในแชตเมื่อเครื่องดื่มพร้อม</div>`}
    <label for="f-note"><div class="lbl">หมายเหตุถึงร้าน (ถ้ามี)</div><textarea id="f-note" data-f="note" rows="2">${info.note||""}</textarea></label>
    <button class="primary" id="sendBtn" ${missing.length||(t.free&&!freeSw)?"disabled":""}>สั่งเลย · ${baht(t.total)}</button>
    ${t.free&&!freeSw?`<div class="note">เลือกความหวานอเมริกาโน่แถมฟรีก่อนกดสั่ง</div>`:""}
    ${p?`<div class="note" id="missNote" ${missing.length?"":"hidden"}>กรอก${p.fields.map(f=>f.label).join(" และ ")}ก่อนกดสั่ง</div>`:""}`);
  saveCart();
  $("#sheetIn").oninput=e=>{ if(e.target.dataset.f){ info[e.target.dataset.f]=e.target.value; saveCart();
      const miss=p?p.fields.some(f=>!(info[f.id]||"").trim()):false; $("#sendBtn").disabled=miss||(t.free&&!freeSw);
      const mn=$("#missNote"); if(mn) mn.hidden=!miss; } };
  $("#sheetIn").onclick=e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.k){const l=cart[b.dataset.k]; l.qty+= +b.dataset.d; if(l.qty<1) cart.splice(b.dataset.k,1); render(); cartSheet();}
    else if(b.dataset.del){ cart.splice(+b.dataset.del,1); render(); cartSheet(); }
    else if(b.dataset.edit){ const k=+b.dataset.edit; if(MENU.some(x=>x.id===cart[k].id)) pickSheet(cart[k].id,k); }
    else if(b.dataset.method){method=b.dataset.method; cartSheet();}
    else if(b.dataset.fsw){freeSw=SWEET[+b.dataset.fsw]; cartSheet();}
    else if(b.dataset.fbean){freeBean=+b.dataset.fbean; cartSheet();}
    else if(b.id==="sendBtn") send();
  };
}

function orderData(){
  const m=MODES[mode], p=m.partner, t=totals();
  const no="R"+new Date().toTimeString().slice(0,5).replace(":","")+Math.floor(Math.random()*90+10);
  return {no,p,t,method:p?method:"pickup",info:{...info},lines:cart.map(l=>({...l})),free:t.free?freeOpts():null};
}
function flexOf(o){
  const txt=(text,extra={})=>({type:"text",text:String(text),size:"sm",wrap:true,...extra});
  const row=(a,b,extra={})=>({type:"box",layout:"horizontal",contents:[txt(a,{flex:4,...extra}),txt(b,{flex:2,align:"end",...extra})]});
  const items=o.lines.map(l=>{
    const left={type:"box",layout:"vertical",flex:4,contents:[txt(l.name,{weight:"bold"}),...(l.opts.length?[txt(l.opts.join(" · "),{size:"xs",color:"#888888"})]:[])]};
    const c=[];
    if(l.image) c.push({type:"image",url:l.image,size:"xxs",aspectMode:"cover",aspectRatio:"3:4",flex:0});
    c.push(left, txt("x"+l.qty,{flex:1,align:"center"}), txt(baht(l.qty*l.price),{flex:2,align:"end"}));
    return {type:"box",layout:"horizontal",spacing:"md",contents:c,alignItems:"center"};
  });
  if(o.free) items.push({type:"box",layout:"vertical",contents:[row(CONFIG.freeItem+" x1","฿0",{color:"#1DB446",weight:"bold"}),txt(o.free.join(" · "),{size:"xs",color:"#888888"})]});
  const body=[
    txt("ใบสั่งซื้อ RIDE COFFEE",{weight:"bold",size:"lg"}),
    txt(`#${o.no} · ${o.p?o.p.label:"ลูกค้าทั่วไป"}`,{size:"xs",color:"#888888"}),
    {type:"separator",margin:"md"},
    {type:"box",layout:"vertical",spacing:"md",margin:"md",contents:items},
    {type:"separator",margin:"md"},
    {type:"box",layout:"vertical",margin:"md",spacing:"xs",contents:[
      row("รวม "+o.t.cups+" แก้ว",baht(o.t.sub)),
      ...(o.p?[row("ส่วนลด "+CONFIG.discount*100+"%","−"+baht(o.t.disc),{color:"#1DB446"})]:[]),
      row("ยอดชำระ",baht(o.t.total),{weight:"bold",size:"md"})]},
    {type:"separator",margin:"md"},
    txt(o.method==="delivery"?"🛵 ส่งถึงที่":"🏪 รับที่ร้าน",{weight:"bold",margin:"md"})
  ];
  if(o.p) o.p.fields.forEach(f=>body.push(txt(`${f.label}: ${o.info[f.id]||"-"}`)));
  if((o.info.note||"").trim()) body.push(txt("หมายเหตุ: "+o.info.note.trim(),{color:"#555555"}));
  return {type:"flex",altText:`สั่ง ${o.t.cups} แก้ว ยอด ${baht(o.t.total)}`,contents:{type:"bubble",body:{type:"box",layout:"vertical",contents:body}}};
}
function previewBubble(o){
  return `<div class="chat"><div class="bubble"><h3>ใบสั่งซื้อ RIDE COFFEE</h3><div class="g">#${o.no} · ${o.p?o.p.label:"ลูกค้าทั่วไป"}</div><hr>
    ${o.lines.map(l=>`<div class="r"><span><b>${l.name}</b><br><span class="g">${l.opts.join(" · ")}</span></span><span>x${l.qty}</span><span>${baht(l.qty*l.price)}</span></div>`).join("")}
    ${o.free?`<div class="r" style="color:#1DB446"><span><b>${CONFIG.freeItem}</b><br><span class="g">${o.free.join(" · ")}</span></span><span>x1</span><span>฿0</span></div>`:""}<hr>
    <div class="r"><span>รวม ${o.t.cups} แก้ว</span><span>${baht(o.t.sub)}</span></div>
    ${o.p?`<div class="r" style="color:#1DB446"><span>ส่วนลด ${CONFIG.discount*100}%</span><span>−${baht(o.t.disc)}</span></div>`:""}
    <div class="r"><b>ยอดชำระ</b><b>${baht(o.t.total)}</b></div><hr>
    <b>${o.method==="delivery"?"🛵 ส่งถึงที่":"🏪 รับที่ร้าน"}</b>
    ${o.p?o.p.fields.map(f=>`<div>${f.label}: ${o.info[f.id]||"-"}</div>`).join(""):""}
    ${(o.info.note||"").trim()?`<div class="g">หมายเหตุ: ${o.info.note.trim()}</div>`:""}</div></div>`;
}
async function send(){
  const o=orderData();
  if(liffReady && liff.isInClient()){
    const btn=$("#sendBtn"); if(btn){ btn.disabled=true; btn.textContent="กำลังส่งออเดอร์…"; }
    try{
      let txt=null;
      if(CONFIG.api && !CONFIG.api.startsWith("__")){
        const r=await fetch(CONFIG.api+"/api/order",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({
          accessToken:liff.getAccessToken(), mode, method:o.method, note:o.info.note||"", free:o.free,
          info:Object.fromEntries(Object.entries(o.info).filter(([k])=>k!=="note")),
          lines:o.lines.map(l=>({id:l.id,name:l.name,qty:l.qty,opts:l.opts}))})});
        const j=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j.error||"ระบบรับออเดอร์ไม่ตอบสนอง");
        o.no=j.no; o.t={...o.t,sub:j.subtotal,disc:j.discount,total:j.total}; o.method=j.method;
        txt={type:"text",text:`ยืนยันออเดอร์ #${j.no} ยอด ฿${j.total} ชำระด้วย QR และส่งสลิปเพื่อเริ่มการสั่งซื้อ`};
      }
      await liff.sendMessages(txt?[flexOf(o),txt]:[flexOf(o)]);
      cart=[]; info={}; freeSw=null; clearCart(); liff.closeWindow(); return;
    }catch(err){ openSheet(`<h2>ส่งคำสั่งซื้อไม่สำเร็จ</h2><div class="note">${err.message||err}</div><div class="note">ลองกดสั่งอีกครั้ง หรือปิดหน้านี้แล้วเปิดใหม่จากเมนูในแชต RiDE Cafe</div><button class="primary" id="retryBtn">กลับไปที่ตะกร้า</button>`);
      $("#sheetIn").onclick=e=>{ if(e.target.id==="retryBtn") cartSheet(); }; return; }
  }
  openSheet(`<h2>ตัวอย่างข้อความที่จะส่งเข้าแชต</h2>
    <div class="note">เปิดนอกแอป LINE จึงยังไม่ได้ส่งจริง เมื่อลูกค้ากดจากริชเมนูในไลน์ การ์ดนี้จะเข้าแชตร้านทันที</div>
    ${previewBubble(o)}<button class="primary" id="resetBtn">เริ่มสั่งใหม่</button>`);
  $("#sheetIn").onclick=e=>{ if(e.target.id==="resetBtn"){cart=[];info={};method="delivery";freeSw=null;freeBean=0;clearCart();closeSheet();render();} };
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.add) pickSheet(b.dataset.add);
  else if(b.dataset.c){cat=b.dataset.c;render();}
  else if(b.dataset.m){mode=b.dataset.m;cat="all";cart=[];info={};method="delivery";freeSw=null;freeBean=0;render();}
  else if(b.id==="openCart") cartSheet();
});
$("#scrim").onclick=closeSheet;

async function loadMenu(){
  try{
    const r=await fetch("menu.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw 0;
    const d=await r.json();
    if(Array.isArray(d.cats)&&d.cats.length) CATS=d.cats.map((c,k)=>({...c,tint:c.tint||["#C8935A","#7DB46C","#C97A6A","#E59A3B","#8A7BD8","#4FA7C8"][k%6]}));
    if(Array.isArray(d.items)&&d.items.length) MENU=d.items;
  }catch(e){}
}
function boot(){
  loadMenu().then(render);
  if(!CONFIG.liffId){ $("#demo").hidden=false; render(); return; }
  const s=document.createElement("script"); s.src="https://static.line-scdn.net/liff/edge/2/sdk.js";
  s.onload=()=>liff.init({liffId:CONFIG.liffId}).then(()=>{
    liffReady=true;
    const m2=new URLSearchParams(location.search).get("mode"); /* LIFF ส่ง ?mode= มาหลัง init */
    if(MODES[m2]) mode=m2;
    render();
  }).catch(err=>{$("#demo").hidden=false;$("#demo").insertAdjacentHTML("beforeend",`<span style="color:var(--warn);width:100%">LIFF: ${(err&&(err.code||err.message))||err}</span>`);render();});
  s.onerror=()=>{$("#demo").hidden=false;render();};
  document.head.appendChild(s); render();
}
boot();
</script>
